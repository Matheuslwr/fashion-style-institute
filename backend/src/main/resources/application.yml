server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fsi_store}
    username: ${DATABASE_USERNAME:fsi_store}
    password: ${DATABASE_PASSWORD:fsi_store_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  image-storage: ${IMAGE_STORAGE:local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}
  upload-dir: ${UPLOAD_DIR:uploads}
  pix:
    key: ${PIX_KEY:}
    receiver-name: ${PIX_RECEIVER_NAME:}
    receiver-city: ${PIX_RECEIVER_CITY:}
  shipping:
    cep-api: ${CEP_API_BASE_URL:https://brasilapi.com.br}